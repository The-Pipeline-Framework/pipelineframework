openapi: 3.1.2
info: { title: Evidence API, version: 1.0.0 }
servers:
  - url: https://{tenant}.descriptive-only.invalid/v1
    variables: { tenant: { default: never-runtime-authority } }
components:
  securitySchemes:
    callbackSignature: { type: apiKey, in: header, name: X-Callback-Signature }
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.descriptive-only.invalid/token
          scopes: { evidence.read: Read evidence }
    apiKey: { type: apiKey, in: header, name: X-Api-Key }
paths:
  /jobs:
    post:
      operationId: startJob
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/components/schemas/StartJobRequest' }
      responses:
        '202':
          description: Job accepted; completion arrives through the callback
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/JobAccepted' }
      callbacks:
        jobStatus:
          '{$request.body#/callbackUrl}':
            post:
              operationId: jobCompleted
              security: [ { callbackSignature: [] } ]
              requestBody:
                required: true
                content:
                  application/json:
                    schema: { $ref: './schemas.yaml#/components/schemas/JobCallback' }
              responses:
                '202': { description: 'Completion recorded, including a valid duplicate' }
  /evidence/{subject}/lookup:
    post:
      operationId: lookupEvidence
      security: [ { oauth2: [ evidence.read ] } ]
      parameters:
        - { name: subject, in: path, required: true, schema: { type: string } }
        - { name: verbose, in: query, required: true, schema: { type: boolean } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/components/schemas/LookupBody' }
      responses:
        '200':
          description: Evidence found
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/LookupResponse' }
        '404': { description: Evidence not found }
        '429': { description: Rate limited }
  /evidence:
    post:
      operationId: recordEvidence
      security: [ { apiKey: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/components/schemas/RecordBody' }
      responses:
        '202':
          description: Evidence recorded
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/RecordResponse' }
        '409': { description: Conflict }
        '429': { description: Rate limited }
