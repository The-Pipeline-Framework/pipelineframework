version: 3

types:
  DocumentFile:
    java: org.pipelineframework.blocks.document.DocumentFile
    fields: [[sourceId, string], [fileName, string], [contentType, string], [content, payload_ref]]
    mappings:
      file:
        type: org.pipelineframework.blocks.document.MaterializedDocument
        options: { fields: [sourceId, fileName, contentType, content], maxBytes: 10485760 }
  ExtractionDiagnostics:
    java: org.pipelineframework.blocks.document.ExtractionDiagnostics
    fields:
      - [format, string]
      - [selectedBy, string]
      - [contentType, string]
      - [inputBytes, int64]
      - [extractedCharacters, int32]
      - { name: notes, repeated: string }
  ExtractedDocument:
    java: org.pipelineframework.blocks.document.ExtractedDocument
    fields: [[sourceId, string], [text, string], [diagnostics, ExtractionDiagnostics]]

pipelines:
  document-text-extraction:
    input: DocumentFile
    output: ExtractedDocument
    steps:
      - name: Extract document text
        service: org.pipelineframework.blocks.document.ExtractDocumentTextService
        cardinality: ONE_TO_ONE
        input: DocumentFile
        output: ExtractedDocument
        java:
          input: org.pipelineframework.blocks.document.MaterializedDocument
          output: org.pipelineframework.blocks.document.ExtractedDocument
