basePackage: org.pipelineframework.connector
transport: LOCAL
connectors:
  jpa:
    provider: jpa.query
    version: 1
steps:
  - name: Load Customer Risk
    kind: query
    operation: find.one
    using: jpa
    config:
      entity: org.pipelineframework.connector.query.jpa.CustomerRiskEntity
      where:
        customerId:
          operator: eq
          values: [input.customerId]
      projection:
        customerId: customerId
        riskBand: riskBand
        score: score
      result: single
  - name: Load Invoice Files
    kind: query
    operation: find.one
    using: jpa
    config:
      entity: org.pipelineframework.connector.query.jpa.InvoiceFilesEntity
      where:
        documentId:
          operator: eq
          values: [input.documentId]
      result: single
