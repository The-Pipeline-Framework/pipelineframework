schemaVersion: 1
importId: evidence-api
source:
  snapshot: contract/openapi.yaml
  closureSha256: d51b3fa4db429e915ce527f92e3e908a5bcaeb1cbecab026f8067310383f7b45
operations:
  - source: { operationId: startJob, method: POST, path: /jobs }
    operation: job.start
    version: 1
    kind: COMMAND
    input: StartJobRequest
    output: JobAccepted
    server: APPLICATION_BOUND
    security: { none: true }
    request:
      mediaType: application/json
      representation: http.job.start.request
    providerIdempotencyKey: { location: HEADER, name: Idempotency-Key }
    responses:
      - status: '202'
        mediaType: application/json
        outcome: SUCCEEDED
        representation: http.job.accepted
        confirmation: PROVIDER_ACKNOWLEDGED
    callbacks:
      - source:
          name: jobStatus
          expression: '{$request.body#/callbackUrl}'
          method: POST
          operationId: jobCompleted
        callback: job.completed
        input: JobCallback
        request:
          mediaType: application/json
          representation: http.job.completed.request
        acknowledgement: { status: '202' }
        security:
          require: { callbackSignature: [] }
  - source: { operationId: lookupEvidence, method: POST, path: "/evidence/{subject}/lookup" }
    operation: evidence.lookup
    version: 1
    kind: QUERY
    input: LookupArguments
    output: LookupResult
    server: APPLICATION_BOUND
    security:
      require: { oauth2: [ evidence.read ] }
    request:
      mediaType: application/json
      bodyPath: body
      representation: http.evidence.lookup.request
      parameterSources: { subject: subject, verbose: verbose }
    responses:
      - { status: '200', mediaType: application/json, outcome: RESULT, representation: http.evidence.lookup.response }
      - { status: '404', outcome: EMPTY, code: evidence-not-found }
      - { status: '429', outcome: RETRYABLE_FAILURE, code: rate-limited }
  - source: { operationId: recordEvidence, method: POST, path: /evidence }
    operation: evidence.record
    version: 1
    kind: COMMAND
    input: RecordArguments
    output: RecordResult
    server: APPLICATION_BOUND
    security:
      require: { apiKey: [] }
    request:
      mediaType: application/json
      representation: http.evidence.record.request
    providerIdempotencyKey: { location: HEADER, name: Idempotency-Key }
    responses:
      - status: '202'
        mediaType: application/json
        outcome: SUCCEEDED
        representation: http.evidence.record.response
        confirmation: PROVIDER_ACKNOWLEDGED
      - { status: '409', outcome: TERMINAL_FAILURE, code: evidence-conflict }
      - { status: '429', outcome: RETRYABLE_FAILURE, code: rate-limited }
