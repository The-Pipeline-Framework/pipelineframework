name: TPF System Tests — Compatibility Set

on:
  workflow_dispatch:
    inputs:
      set_id:
        description: Stable identifier for this coordinated candidate set
        required: true
        type: string
      pull_requests:
        description: Comma- or newline-separated GitHub pull-request URLs (2–10, one per component)
        required: true
        type: string

concurrency:
  group: tpf-system-test-set-${{ inputs.set_id }}
  cancel-in-progress: true

jobs:
  parse:
    name: Validate compatibility-set request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.request.outputs.matrix }}
      repository_names: ${{ steps.request.outputs.repository_names }}
    steps:
      - name: Checkout trusted coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse allowed pull requests
        id: request
        env:
          PULL_REQUESTS: ${{ inputs.pull_requests }}
          SET_ID: ${{ inputs.set_id }}
        run: |
          printf '%s\n' "$PULL_REQUESTS" > pull-requests.txt
          node system-tests/scripts/parse-compatibility-prs.mjs \
            --components system-tests/components.yml \
            --input pull-requests.txt \
            --setId "$SET_ID" \
            --output compatibility-set-request.json
          echo "matrix=$(jq -c '{include: .requests}' compatibility-set-request.json)" >> "$GITHUB_OUTPUT"
          echo "repository_names=$(jq -r '[.requests[].repositoryName] | join(",")' compatibility-set-request.json)" >> "$GITHUB_OUTPUT"

      - name: Preserve validated request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpf-compatibility-set-request
          path: compatibility-set-request.json
          retention-days: 30
          if-no-files-found: error

  pending:
    name: Resolve heads and post pending statuses
    needs: parse
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download validated request
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: tpf-compatibility-set-request
          path: request

      - name: Create repository-scoped status token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SYSTEM_TEST_APP_ID }}
          private-key: ${{ secrets.SYSTEM_TEST_APP_PRIVATE_KEY }}
          owner: The-Pipeline-Framework
          repositories: ${{ needs.parse.outputs.repository_names }}
          permission-pull-requests: read
          permission-statuses: write

      - name: Resolve current pull-request heads
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p targets/pulls
          : > targets/targets.ndjson
          while IFS=$'\t' read -r component repository number; do
            gh api "repos/$repository/pulls/$number" > "targets/pulls/$component.json"
            jq -e --arg repository "$repository" \
              '.state == "open" and .base.repo.full_name == $repository and (.head.sha | test("^[0-9a-f]{40}$"))' \
              "targets/pulls/$component.json" > /dev/null
            jq -c --arg component "$component" --arg repository "$repository" --argjson number "$number" \
              '{component: $component, repository: $repository, repositoryName: ($repository | split("/")[1]), pullRequestNumber: $number, sourceSha: .head.sha}' \
              "targets/pulls/$component.json" >> targets/targets.ndjson
          done < <(jq -r '.requests[] | [.component, .repository, .pullRequestNumber] | @tsv' request/compatibility-set-request.json)
          jq -s '{schemaVersion: 1, targets: sort_by(.component)}' targets/targets.ndjson > targets/targets.json

      - name: Mark every candidate pending
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          while IFS=$'\t' read -r repository sha; do
            gh api --method POST "repos/$repository/statuses/$sha" \
              -f state=pending \
              -f context='tpf/system-tests' \
              -f description='TPF coordinated system tests are running' \
              -f target_url="$TARGET_URL"
          done < <(jq -r '.targets[] | [.repository, .sourceSha] | @tsv' targets/targets.json)

      - name: Preserve immutable targets
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpf-compatibility-set-targets
          path: targets/
          retention-days: 30
          if-no-files-found: error

  retrieve:
    name: Retrieve and attest every candidate
    needs: [parse, pending]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout trusted coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download request and targets
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: tpf-compatibility-set-*
          path: intake
          merge-multiple: true

      - name: Create repository-scoped read token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SYSTEM_TEST_APP_ID }}
          private-key: ${{ secrets.SYSTEM_TEST_APP_PRIVATE_KEY }}
          owner: The-Pipeline-Framework
          repositories: ${{ needs.parse.outputs.repository_names }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read

      - name: Install ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Validate provenance and store immutable manifests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GHCR_TOKEN: ${{ github.token }}
          SET_ID: ${{ inputs.set_id }}
        run: |
          image="$(jq -r '.candidateManifestImage' system-tests/components.yml)"
          echo "$GHCR_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p candidates
          : > candidates/attested.ndjson
          while IFS=$'\t' read -r component repository number sha; do
            directory="candidates/$component"
            mkdir -p "$directory"
            gh api "repos/$repository/actions/workflows/tpf-candidate-publish.yml/runs?event=workflow_run&status=completed&per_page=50" \
              > "$directory/runs.json"
            run_id=''
            while read -r candidate_run_id; do
              rm -rf "$directory/event"
              if gh run download "$candidate_run_id" --repo "$repository" --name tpf-candidate-event --dir "$directory/event" 2>/dev/null \
                && jq -e --arg repository "$repository" --arg component "$component" --arg sha "$sha" --argjson number "$number" \
                  '.source_repository == $repository and .component == $component and .source_sha == $sha and .pull_request_number == $number' \
                  "$directory/event/event.json" > /dev/null; then
                run_id="$candidate_run_id"
                break
              fi
            done < <(jq -r '.workflow_runs[] | select(.conclusion == "success") | .id' "$directory/runs.json")
            test -n "$run_id"
            gh run download "$run_id" --repo "$repository" --name tpf-candidate-manifest --dir "$directory/manifest"
            test -f "$directory/event/event.json"
            test -f "$directory/manifest/candidate-manifest.json"
            gh api "repos/$repository/actions/runs/$run_id" > "$directory/publication-workflow-run.json"
            build_run_id="$(jq -er '.provenance.build.runId | select(type == "number" and . > 0)' "$directory/manifest/candidate-manifest.json")"
            gh api "repos/$repository/actions/runs/$build_run_id" > "$directory/build-workflow-run.json"
            gh api "repos/$repository/pulls/$number" > "$directory/pull-request.json"
            jq -e --arg repository "$repository" --arg component "$component" --arg sha "$sha" --argjson number "$number" --arg set "$SET_ID" \
              '.source_repository == $repository and .component == $component and .source_sha == $sha and .pull_request_number == $number and (.compatibility_set_id == null or .compatibility_set_id == $set)' \
              "$directory/event/event.json" > /dev/null
            node system-tests/scripts/validate-candidate.mjs \
              --components system-tests/components.yml \
              --event "$directory/event/event.json" \
              --manifest "$directory/manifest/candidate-manifest.json" \
              --publicationRun "$directory/publication-workflow-run.json" \
              --buildRun "$directory/build-workflow-run.json" \
              --pullRequest "$directory/pull-request.json" \
              > "$directory/validated-candidate.json"
            (
              cd "$directory/manifest"
              oras push --format json \
                --annotation "org.opencontainers.image.revision=$sha" \
                --annotation "org.pipelineframework.component=$component" \
                "$image:$component-$sha-$run_id-${{ github.run_id }}-${{ github.run_attempt }}" \
                candidate-manifest.json:application/vnd.tpf.candidate-manifest.v1+json
            ) > "$directory/candidate-oci.json"
            digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' "$directory/candidate-oci.json")"
            jq -n --arg component "$component" --arg manifest "$component/manifest/candidate-manifest.json" --arg digest "$digest" \
              '{component: $component, manifest: $manifest, digest: $digest}' >> candidates/attested.ndjson
          done < <(jq -r '.targets[] | [.component, .repository, .pullRequestNumber, .sourceSha] | @tsv' intake/targets.json)
          jq -s '{schemaVersion: 1, candidates: sort_by(.component)}' candidates/attested.ndjson > candidates/attested.json

      - name: Preserve attested candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpf-attested-compatibility-set
          path: candidates/
          retention-days: 30
          if-no-files-found: error

  resolve:
    name: Resolve baseline and union mandatory suites
    needs: [parse, retrieve]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout trusted coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download immutable inputs
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: tpf-*compatibility-set*
          path: input
          merge-multiple: true

      - name: Install ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Resolve baseline once and overlay all candidates
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          image="$(jq -r '.baselineImage' system-tests/components.yml)"
          echo "$GHCR_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          digest="$(oras resolve "$image:main")"
          case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1;; esac
          mkdir -p resolved/baseline
          oras pull "$image@$digest" --output resolved/baseline
          candidate_args=()
          digest_args=()
          while IFS=$'\t' read -r manifest candidate_digest; do
            candidate_args+=(--candidates "input/$manifest")
            digest_args+=(--candidateDigests "$candidate_digest")
          done < <(jq -r '.candidates[] | [.manifest, .digest] | @tsv' input/attested.json)
          node system-tests/scripts/resolve-set.mjs \
            --components system-tests/components.yml \
            --baseline resolved/baseline/baseline.json \
            --baselineDigest "$digest" \
            "${candidate_args[@]}" "${digest_args[@]}" \
            --output resolved/resolved-set.json
          node system-tests/scripts/select-set-suites.mjs \
            --components system-tests/components.yml \
            --policy system-tests/policy.yml \
            --resolvedSet resolved/resolved-set.json \
            --compatibilitySet input/compatibility-set-request.json \
            --output resolved/suite-matrix.json
          cp input/compatibility-set-request.json input/targets.json resolved/
          cp resolved/baseline/baseline.json resolved/baseline.json

      - name: Export suite matrix
        id: matrix
        run: echo "matrix=$(jq -c . resolved/suite-matrix.json)" >> "$GITHUB_OUTPUT"

      - name: Preserve exact coordinated test set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpf-resolved-compatibility-set
          path: resolved/
          retention-days: 30
          if-no-files-found: error

  materialize:
    name: Materialize immutable Maven inputs
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout trusted coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Download resolved set
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: tpf-resolved-compatibility-set
          path: resolved

      - name: Install ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Fetch every pinned component manifest
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          image="$(jq -r '.candidateManifestImage' system-tests/components.yml)"
          echo "$GHCR_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p component-manifests
          while IFS=$'\t' read -r component digest; do
            mkdir -p "component-manifests/$component"
            oras pull "$image@$digest" --output "component-manifests/$component"
          done < <(jq -r '.components | to_entries[] | [.key, .value.manifestDigest] | @tsv' resolved/resolved-set.json)
          manifest_args=()
          while IFS= read -r manifest; do manifest_args+=(--manifests "$manifest"); done < <(find component-manifests -name candidate-manifest.json -type f | sort)
          node system-tests/scripts/materialization-plan.mjs \
            --components system-tests/components.yml \
            "${manifest_args[@]}" \
            --output materialization-plan.json

      - name: Hydrate and attest isolated Maven repository
        env:
          PACKAGE_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/tpf-maven"
          node system-tests/scripts/write-maven-settings.mjs \
            --components system-tests/components.yml \
            --output "$RUNNER_TEMP/tpf-maven/settings.xml" \
            --repositoriesOutput "$RUNNER_TEMP/tpf-maven/repositories.txt"
          local_repo="$RUNNER_TEMP/tpf-system-test-m2"
          while IFS= read -r coordinate; do
            ./mvnw -B -s "$RUNNER_TEMP/tpf-maven/settings.xml" \
              org.apache.maven.plugins:maven-dependency-plugin:3.9.0:get \
              -Dartifact="$coordinate" \
              -DremoteRepositories="$(cat "$RUNNER_TEMP/tpf-maven/repositories.txt")" \
              -Dtransitive=true \
              -Dmaven.repo.local="$local_repo" \
              --no-transfer-progress
          done < <(jq -r '.artifacts[].coordinate' materialization-plan.json)
          node system-tests/scripts/verify-materialized.mjs --plan materialization-plan.json --repository "$local_repo"
          mkdir -p "$RUNNER_TEMP/tpf-test-inputs"
          tar -C "$local_repo" -czf "$RUNNER_TEMP/tpf-test-inputs/tpf-system-test-m2.tar.gz" .
          cp resolved/resolved-set.json resolved/suite-matrix.json "$RUNNER_TEMP/tpf-test-inputs/"

      - name: Publish credential-free test inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpf-materialized-compatibility-set-inputs
          path: ${{ runner.temp }}/tpf-test-inputs/
          retention-days: 14
          if-no-files-found: error

  run-product-shard:
    name: ${{ matrix.displayName }}
    needs: [resolve, materialize]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    permissions:
      contents: read
    steps:
      - name: Checkout trusted coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: coordination
          persist-credentials: false

      - name: Checkout every pinned shard owner
        env:
          SHARD_JSON: ${{ toJson(matrix) }}
        run: |
          printf '%s\n' "$SHARD_JSON" > shard.json
          node coordination/system-tests/scripts/prepare-shard-sources.mjs \
            --shard shard.json \
            --output owners

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Download credential-free inputs
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: tpf-materialized-compatibility-set-inputs
          path: inputs

      - name: Run product shard without privileged credentials
        run: |
          mkdir -p "$RUNNER_TEMP/tpf-system-test-m2"
          tar -C "$RUNNER_TEMP/tpf-system-test-m2" -xzf inputs/tpf-system-test-m2.tar.gz
          node coordination/system-tests/scripts/run-shard.mjs \
            --shard "$GITHUB_WORKSPACE/shard.json" \
            --coordination "$GITHUB_WORKSPACE/coordination" \
            --owners "$GITHUB_WORKSPACE/owners" \
            --resolvedSet "$GITHUB_WORKSPACE/inputs/resolved-set.json" \
            --mavenRepository "$RUNNER_TEMP/tpf-system-test-m2"

  report:
    name: Report one result to every candidate
    if: always() && needs.pending.result != 'skipped'
    needs: [parse, pending, retrieve, resolve, materialize, run-product-shard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download immutable targets
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: tpf-compatibility-set-targets
          path: targets

      - name: Create repository-scoped status token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SYSTEM_TEST_APP_ID }}
          private-key: ${{ secrets.SYSTEM_TEST_APP_PRIVATE_KEY }}
          owner: The-Pipeline-Framework
          repositories: ${{ needs.parse.outputs.repository_names }}
          permission-statuses: write

      - name: Publish aggregate result
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RETRIEVE_RESULT: ${{ needs.retrieve.result }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          MATERIALIZE_RESULT: ${{ needs.materialize.result }}
          TEST_RESULT: ${{ needs.run-product-shard.result }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$TEST_RESULT" = failure ]; then
            state=failure
            description='A mandatory coordinated TPF product-test shard failed'
          elif [ "$RETRIEVE_RESULT" = success ] && [ "$RESOLVE_RESULT" = success ] && \
               [ "$MATERIALIZE_RESULT" = success ] && [ "$TEST_RESULT" = success ]; then
            state=success
            description='All coordinated TPF product-test shards passed'
          else
            state=error
            description='TPF coordinated orchestration or infrastructure failed'
          fi
          while IFS=$'\t' read -r repository sha; do
            gh api --method POST "repos/$repository/statuses/$sha" \
              -f state="$state" \
              -f context='tpf/system-tests' \
              -f description="$description" \
              -f target_url="$TARGET_URL"
          done < <(jq -r '.targets[] | [.repository, .sourceSha] | @tsv' targets/targets.json)
