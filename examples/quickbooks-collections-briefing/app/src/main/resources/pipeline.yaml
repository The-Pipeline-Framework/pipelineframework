version: 3
appName: QuickBooks Collections Briefing
basePackage: org.pipelineframework.examples.quickbooks
transport: LOCAL
platform: COMPUTE
contract:
  input: <mcp.client.QuickBooksAgedReceivablesRequest>
  output: CollectionsBriefing

connectors:
  quickbooks:
    provider: mcp.client
    version: 1
    config:
      # Defined by quickbooks.connection.reference in application.properties.
      connection: quickbooks-sandbox

types:
  CollectionAccount:
    fields:
      - [reportDate, string]
      - [currency, string]
      - [accountPresent, bool]
      - [customerId, string]
      - [customer, string]
      - [current, decimal]
      - [days1To30, decimal]
      - [days31To60, decimal]
      - [days61To90, decimal]
      - [over90, decimal]
      - [total, decimal]
  CollectionAction:
    fields:
      - [account, CollectionAccount]
      - [overdue, decimal]
      - [priority, string]
      - [rationale, string]
      - [recommendedAction, string]
  CollectionsBriefing:
    fields:
      - [reportDate, string]
      - [currency, string]
      - [totalOutstanding, decimal]
      - [overdueOutstanding, decimal]
      - [priorityAccounts, int64]
      - [headline, string]
      - name: actions
        repeated: CollectionAction

steps:
  - name: Read aged receivables
    kind: query
    cardinality: ONE_TO_ONE
    input: <mcp.client.QuickBooksAgedReceivablesRequest>
    output: <tpf.connector.JsonPayload>
    using: quickbooks
    operation: quickbooks.receivables.aged
    operationVersion: 1
    java:
      input: org.pipelineframework.examples.quickbooks.domain.QuickBooksAgedReceivablesRequest
      output: org.pipelineframework.connector.JsonPayload
  - name: Extract receivables accounts
    service: org.pipelineframework.examples.quickbooks.AgedReceivablesInterpreterService
    cardinality: ONE_TO_MANY
    input: <tpf.connector.JsonPayload>
    output: CollectionAccount
    java:
      input: org.pipelineframework.connector.JsonPayload
      output: org.pipelineframework.examples.quickbooks.domain.CollectionAccount
  - name: Apply collections policy
    service: org.pipelineframework.examples.quickbooks.CollectionPolicyService
    cardinality: ONE_TO_ONE
    input: CollectionAccount
    output: CollectionAction
    java:
      input: org.pipelineframework.examples.quickbooks.domain.CollectionAccount
      output: org.pipelineframework.examples.quickbooks.domain.CollectionAction
  - name: Prepare collections briefing
    service: org.pipelineframework.examples.quickbooks.CollectionsBriefingService
    cardinality: MANY_TO_ONE
    input: CollectionAction
    output: CollectionsBriefing
    java:
      input: org.pipelineframework.examples.quickbooks.domain.CollectionAction
      output: org.pipelineframework.examples.quickbooks.domain.CollectionsBriefing
