name: Publish — Nightly Maven Central Snapshots

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: central-snapshot-publishing
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and Publish Snapshot
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Verify framework
        run: ./mvnw -B -f framework/pom.xml clean verify --no-transfer-progress -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"

      - name: Resolve snapshot identity
        id: snapshot
        run: |
          VERSION="$(./mvnw -q -f framework/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)"
          case "$VERSION" in *-SNAPSHOT) ;; *) exit 1;; esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup GPG signing key
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Deploy snapshot to Maven Central
        run: |
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          ./mvnw -B -f framework/pom.xml clean deploy -Pcentral-publishing -DskipTests -U --no-transfer-progress -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish exact-version snapshot author MCP knowledge
        env:
          GH_TOKEN: ${{ secrets.TPF_MCP_DISPATCH_TOKEN }}
          VERSION: ${{ steps.snapshot.outputs.version }}
          SNAPSHOT_COMMIT: ${{ steps.snapshot.outputs.commit }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg framework_commit "$SNAPSHOT_COMMIT" \
            '{ref:"main",inputs:{kind:"snapshot",version:$version,framework_commit:$framework_commit}}' \
            | gh api --method POST repos/The-Pipeline-Framework/tpf-mcp-bridge/actions/workflows/publish-knowledge.yml/dispatches --input -
