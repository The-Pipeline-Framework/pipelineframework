pipeline.defaults.retry-limit=1
pipeline.orchestrator.mode=SYNC
pipeline.query.capture-store.provider=memory
pipeline.embedding.langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11435}
pipeline.embedding.langchain4j.ollama.request-timeout=${OLLAMA_REQUEST_TIMEOUT:PT30S}
pipeline.llm.langchain4j.ollama.request-timeout=${OLLAMA_REQUEST_TIMEOUT:PT30S}
pipeline.vector.pgvector.schema=${RAG_VECTOR_SCHEMA:public}
pipeline.vector.pgvector.table=${RAG_VECTOR_TABLE:rag_vectors}
pipeline.vector.pgvector.command-table=${RAG_VECTOR_COMMAND_TABLE:rag_vector_commands}
rag.query.top-k=${RAG_TOP_K:5}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${PG_REACTIVE_URL:postgresql://localhost:5433/rag}
quarkus.datasource.username=${PG_USER:rag}
quarkus.datasource.password=${PG_PASSWORD:rag}
quarkus.http.port=${QUERY_HTTP_PORT:8081}
quarkus.grpc.server.port=${QUERY_GRPC_PORT:9001}
quarkus.rest-client.process-prepare-embedding.url=http://localhost:${QUERY_HTTP_PORT:8081}
quarkus.rest-client.process-prepare-vector-search.url=http://localhost:${QUERY_HTTP_PORT:8081}
quarkus.rest-client.process-build-retrieved-context.url=http://localhost:${QUERY_HTTP_PORT:8081}
quarkus.rest-client.process-validate-citations.url=http://localhost:${QUERY_HTTP_PORT:8081}
pipeline.health.rest-path=/q/health/live
quarkus.devservices.enabled=false
