basePackage: org.pipelineframework.connector
transport: LOCAL
connectors:
  reactive-database:
    provider: hibernate.reactive.query
    version: 1
steps:
  - name: Load Reactive Customer Risk
    kind: query
    operation: find.one
    using: reactive-database
    config:
      entity: org.pipelineframework.connector.query.jpa.ReactiveCustomerRiskEntity
      where:
        customerId:
          operator: eq
          values: [input.customerId]
      projection:
        customerId: customerId
        riskBand: riskBand
        score: score
      result: single
