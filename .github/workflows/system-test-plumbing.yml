name: CI — System-test plumbing

on:
  pull_request:
    paths:
      - 'system-tests/**'
      - 'framework/bom/pom.xml'
      - 'scripts/verify-framework-publication.mjs'
      - 'releases/**'
      - '.github/workflows/publish.yml'
      - '.github/workflows/system-test-*.yml'
  push:
    branches: [main]
    paths:
      - 'system-tests/**'
      - 'framework/bom/pom.xml'
      - 'scripts/verify-framework-publication.mjs'
      - 'releases/**'
      - '.github/workflows/publish.yml'
      - '.github/workflows/system-test-*.yml'

permissions:
  contents: read

concurrency:
  group: system-test-plumbing-${{ github.ref }}
  cancel-in-progress: true

env:
  TPF_CENSUS_ENABLED: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate coordination regressions without cloud credentials
        run: node --test system-tests/test/*.test.mjs
      - name: Setup JDK for BOM consumer resolution
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Compile versionless BOM consumer and annotation processor paths
        run: python3 system-tests/scripts/test-bom-consumer.py
      - name: Validate changed cloud and full-train workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/system-test-full-train.yml .github/workflows/system-test-plumbing.yml .github/workflows/system-test-candidate.yml .github/workflows/publish-snapshots.yml
