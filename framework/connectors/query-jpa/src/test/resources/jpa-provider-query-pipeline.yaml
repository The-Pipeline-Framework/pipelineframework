basePackage: org.pipelineframework.connector
transport: LOCAL
connectors:
  jpa:
    provider: jpa.query
    version: 1
steps:
  - name: Load Customer Risk
    kind: query
    operation: find.one
    using: jpa
    config:
      entity: org.pipelineframework.connector.query.jpa.CustomerRiskEntity
      where:
        customerId:
          operator: eq
          values: [input.customerId]
      projection:
        customerId: customerId
        riskBand: riskBand
        score: score
      result: single
  - name: Load Customer Risks
    kind: query
    cardinality: ONE_TO_MANY
    operation: find.many
    using: jpa
    config:
      entity: org.pipelineframework.connector.query.jpa.CustomerRiskEntity
      where:
        customerId:
          operator: eq
          values: [input.customerId]
      projection:
        customerId: customerId
        riskBand: riskBand
        score: score
      orderBy:
        score: asc
        id: asc
      uniqueBy: [id]
  - name: Load Invoice Files
    kind: query
    operation: find.one
    using: jpa
    config:
      entity: org.pipelineframework.connector.query.jpa.InvoiceFilesEntity
      where:
        documentId:
          operator: eq
          values: [input.documentId]
      result: single
  - name: Load Invoice Files Batch
    kind: query
    cardinality: ONE_TO_MANY
    operation: find.many
    using: jpa
    config:
      entity: org.pipelineframework.connector.query.jpa.StreamedInvoiceFilesEntity
      where:
        originalFilename:
          operator: eq
          values: [input.originalFilename]
      orderBy:
        documentId: asc
      uniqueBy: [documentId]
