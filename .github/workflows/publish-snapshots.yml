name: Publish — Main Maven Central Snapshots

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: central-snapshot-publishing
  cancel-in-progress: false

jobs:
  publication-policy:
    name: Check exact incident-only bootstrap publication boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preserve ordinary publication; suppress only reviewed incident bootstrap
        id: policy
        env:
          POLICY_CONTEXT: >-
            ${{ toJson(fromJson(format('{{"repository":{0},"ref":{1},"eventName":{2},"message":{3}}}',
              toJson(github.repository), toJson(github.ref), toJson(github.event_name), toJson(github.event.head_commit.message)))) }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$POLICY_CONTEXT" > publication-context.json
          first_line="$(jq -r '.message // "" | split("\n")[0]' publication-context.json)"
          if [ "${{ github.event_name }}" = push ] && \
             [ "$first_line" = 'ci(system-tests): replay Eclipse formatting outage [incident-20261021]' ]; then
            git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" > publication-changed-paths.txt
            jq -R -s 'split("\n") | map(select(length > 0))' publication-changed-paths.txt > publication-paths.json
          else
            printf '[]\n' > publication-paths.json
          fi
          node system-tests/scripts/formatting-outage-incident.mjs --context publication-context.json --paths publication-paths.json > publication-policy.json
          echo "publish=$(jq -r .publish publication-policy.json)" >> "$GITHUB_OUTPUT"
          cat publication-policy.json >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Verify and Publish Snapshot
    needs: publication-policy
    if: github.ref == 'refs/heads/main' && needs.publication-policy.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Verify framework
        run: ./mvnw -B -f framework/pom.xml clean verify --no-transfer-progress -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"

      - name: Resolve snapshot identity
        id: snapshot
        run: |
          VERSION="$(./mvnw -q -N -f framework/pom.xml help:evaluate -Dexpression=project.version -DforceStdout -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository")"
          case "$VERSION" in *-SNAPSHOT) ;; *) exit 1;; esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup GPG signing key
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Verify publication contract
        run: node scripts/verify-framework-publication.mjs "$GITHUB_WORKSPACE/.m2/repository"

      - name: Deploy snapshot to Maven Central
        run: |
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          ./mvnw -B -f framework/pom.xml clean deploy -Pcentral-publishing -DskipTests -U --no-transfer-progress -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
