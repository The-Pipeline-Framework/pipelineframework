pipeline.defaults.retry-limit=2
pipeline.orchestrator.mode=QUEUE_ASYNC
pipeline.orchestrator.state-provider=memory
pipeline.orchestrator.dispatcher-provider=event
pipeline.orchestrator.dlq-provider=log
pipeline.orchestrator.idempotency-policy=CLIENT_KEY_REQUIRED
pipeline.orchestrator.max-retries=2
pipeline.orchestrator.strict-startup=true
pipeline.query.capture-store.provider=memory
pipeline.command.effect-store.provider=memory
pipeline.embedding.langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11435}
pipeline.embedding.langchain4j.ollama.request-timeout=${OLLAMA_REQUEST_TIMEOUT:PT30S}
pipeline.vector.pgvector.schema=${RAG_VECTOR_SCHEMA:public}
pipeline.vector.pgvector.table=${RAG_VECTOR_TABLE:rag_vectors}
pipeline.vector.pgvector.command-table=${RAG_VECTOR_COMMAND_TABLE:rag_vector_commands}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${PG_JDBC_URL:jdbc:postgresql://localhost:5433/rag}
quarkus.datasource.username=${PG_USER:rag}
quarkus.datasource.password=${PG_PASSWORD:rag}
quarkus.http.port=${INDEXER_HTTP_PORT:8080}
quarkus.devservices.enabled=false
