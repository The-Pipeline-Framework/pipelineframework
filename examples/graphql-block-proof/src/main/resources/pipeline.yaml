version: 3
appName: GraphQL Block Proof
basePackage: org.pipelineframework.examples.graphqlproof
transport: LOCAL
platform: COMPUTE
contract:
  input: GraphQlAgentState
  output: GraphQlAgentCompletion

connectors:
  decision-model:
    provider: proof.graphql.llm
    version: 1
    config: { model: deterministic-graphql-proof }
  primary-graphql:
    provider: graphql.smallrye
    version: 1
    config:
      connection: primary-graphql
      operations:
        customer.lookup:
          kind: QUERY
          operationName: CustomerLookup
          resource: graphql/customer-lookup.graphql
          sha256: bce03f6448ac6810ddd31d019cc6f6ebb9644d1c556d1b67fd64328fe91bdc18
        customer.update:
          kind: MUTATION
          operationName: CustomerUpdate
          resource: graphql/customer-update.graphql
          sha256: d8880449c38b3c50c2102bff7a8132267d31ec249ba6e60d2d721d6c21235514

blockBindings:
  org.pipelineframework.graphql/graphql-agent:
    llm.decide:
      using: decision-model
    graphql.read:
      using: primary-graphql
    graphql.write:
      using: primary-graphql
      commandIdGenerator: org.pipelineframework.connector.graphql.GraphQlEffectKeyCommandIdGenerator
      duplicatePolicy: RETURN_RECORDED
      policy:
        requiredExecutionPosture: AUTOMATED
        minimumMachineConfirmation: PROVIDER_ACKNOWLEDGED

steps:
  - name: Run reusable GraphQL agent
    pipeline: graphql-agent
    cardinality: ONE_TO_ONE
    input: GraphQlAgentState
    output: GraphQlAgentCompletion
    terminal: true
    java:
      input: org.pipelineframework.blocks.graphql.agent.GraphQlAgentState
      output: org.pipelineframework.blocks.graphql.agent.GraphQlAgentCompletion
