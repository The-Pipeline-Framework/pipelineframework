# Deployment-owned definition for pipeline.yaml's quickbooks-sandbox reference.
quickbooks.connection.reference=quickbooks-sandbox
quickbooks.connection.tenant=sandbox-company
quickbooks.connection.server-instance=local-quickbooks-sandbox
quickbooks.mcp.node=${QUICKBOOKS_NODE:}
quickbooks.mcp.server=${QUICKBOOKS_MCP_SERVER:}
quickbooks.mcp.working-directory=${QUICKBOOKS_MCP_WORKING_DIRECTORY:}

# The MCP adapter is an ordinary dependency JAR rather than a Quarkus extension.
quarkus.index-dependency.mcp-connector.group-id=org.pipelineframework
quarkus.index-dependency.mcp-connector.artifact-id=mcp-connector

# Pipeline steps are loaded by generated class name at runtime.
quarkus.arc.unremovable-types=org.pipelineframework.examples.quickbooks.**
