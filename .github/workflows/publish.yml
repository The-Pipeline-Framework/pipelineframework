name: Release — Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      release_commit: ${{ steps.release.outputs.commit }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (GPG enabled)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Resolve immutable release identity
        id: release
        run: |
          VERSION="$(./mvnw -q -f framework/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)"
          test "${GITHUB_REF_NAME#v}" = "$VERSION"
          case "$VERSION" in *-SNAPSHOT) exit 1;; esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Maven Central
        run: |
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          ./mvnw -B -f framework/pom.xml clean deploy -Pcentral-publishing -DskipTests --no-transfer-progress -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true

      - name: Publish exact-version author MCP knowledge
        env:
          GH_TOKEN: ${{ secrets.TPF_MCP_DISPATCH_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg framework_commit "$RELEASE_COMMIT" \
            '{ref:"main",inputs:{version:$version,tag:$tag,framework_commit:$framework_commit}}' \
            | gh api --method POST repos/The-Pipeline-Framework/tpf-mcp-bridge/actions/workflows/publish-knowledge.yml/dispatches --input -

  promote-docs:
    name: Promote Released Docs
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: release-docs-promotion
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.release_commit }}

      - name: Promote released commit to the public docs branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.publish.outputs.release_commit }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          LATEST_RELEASE_TAG="$(
            gh api --paginate 'repos/${{ github.repository }}/releases?per_page=100' \
              --jq '.[].tag_name' \
              | sort -V \
              | tail -1
          )"
          if [ "$RELEASE_TAG" != "$LATEST_RELEASE_TAG" ]; then
            echo "Skipping stale docs promotion for $RELEASE_TAG; latest release is $LATEST_RELEASE_TAG."
            exit 0
          fi

          REMOTE_SHA="$(git ls-remote --refs origin refs/heads/release-docs | cut -f1)"
          if [ -n "$REMOTE_SHA" ]; then
            git push \
              --force-with-lease="refs/heads/release-docs:$REMOTE_SHA" \
              origin \
              "${RELEASE_COMMIT}:refs/heads/release-docs"
          else
            git push origin "${RELEASE_COMMIT}:refs/heads/release-docs"
          fi
