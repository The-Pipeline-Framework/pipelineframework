name: TPF System Tests — Full Train

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

concurrency:
  group: tpf-system-test-full-train
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve current main candidates against immutable baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      baseline_digest: ${{ steps.baseline.outputs.digest }}
      has_candidates: ${{ steps.baseline.outputs.has_candidates }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: List component repositories
        id: repositories
        run: echo "names=$(jq -r '[.components[].repository | split("/")[1]] | join(",")' system-tests/components.yml)" >> "$GITHUB_OUTPUT"

      - name: Create source-repository read token
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SYSTEM_TEST_APP_ID }}
          private-key: ${{ secrets.SYSTEM_TEST_APP_PRIVATE_KEY }}
          owner: The-Pipeline-Framework
          repositories: ${{ steps.repositories.outputs.names }}
          permission-contents: read

      - name: Resolve baseline and current main candidates once
        id: baseline
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          baseline_image="$(jq -r '.baselineImage' system-tests/components.yml)"
          candidate_image="$(jq -r '.candidateManifestImage' system-tests/components.yml)"
          echo "$GHCR_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          digest="$(oras resolve "$baseline_image:main")"
          case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1;; esac
          mkdir -p resolved/baseline resolved/main-candidates resolved/discovery
          oras pull "$baseline_image@$digest" --output resolved/baseline
          test -f resolved/baseline/baseline.json
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

          oras repo tags "$candidate_image" > resolved/candidate-tags.txt
          jq -n '{}' > resolved/current-heads.json
          while IFS=$'\t' read -r component repository; do
            default_branch="$(gh api "repos/$repository" --jq '.default_branch')"
            current_sha="$(gh api "repos/$repository/commits/$default_branch" --jq '.sha')"
            jq --arg component "$component" --arg sha "$current_sha" \
              '. + {($component): $sha}' resolved/current-heads.json > resolved/current-heads.next.json
            mv resolved/current-heads.next.json resolved/current-heads.json

            candidate_digest=''
            pointer_dir="resolved/discovery/$component"
            if pointer_digest="$(oras resolve "$candidate_image:main-$component" 2>/dev/null)"; then
              mkdir -p "$pointer_dir"
              oras pull "$candidate_image@$pointer_digest" --output "$pointer_dir"
              if [ "$(jq -r '.sourceSha' "$pointer_dir/candidate-manifest.json")" = "$current_sha" ]; then
                candidate_digest="$pointer_digest"
              fi
            fi

            candidate_dir="resolved/main-candidates/$component"
            if [ -n "$candidate_digest" ]; then
              mkdir -p "$candidate_dir"
              cp "$pointer_dir/candidate-manifest.json" "$candidate_dir/candidate-manifest.json"
            else
              tag="$(awk -v prefix="$component-$current_sha-" 'index($0, prefix) == 1' resolved/candidate-tags.txt | sort -V | tail -n 1)"
              if [ -n "$tag" ]; then
                candidate_digest="$(oras resolve "$candidate_image:$tag")"
                mkdir -p "$candidate_dir"
                oras pull "$candidate_image@$candidate_digest" --output "$candidate_dir"
              fi
            fi

            if [ -n "$candidate_digest" ]; then
              case "$candidate_digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1;; esac
              test -f "$candidate_dir/candidate-manifest.json"
              printf '%s\n' "$candidate_digest" > "$candidate_dir/digest.txt"
            else
              baseline_sha="$(jq -r --arg component "$component" \
                '.components[$component].sha // .testHarnesses[$component].sha' \
                resolved/baseline/baseline.json)"
              if [ "$current_sha" != "$baseline_sha" ]; then
                echo "No attested current-main candidate exists for $component at $current_sha." >&2
                exit 1
              fi
            fi
          done < <(jq -r '.components | to_entries[] | [.key, .value.repository] | @tsv' system-tests/components.yml)

          candidate_args=()
          digest_args=()
          while IFS= read -r manifest; do
            candidate_args+=(--candidates "$manifest")
            digest_args+=(--candidateDigests "$(cat "$(dirname "$manifest")/digest.txt")")
          done < <(find resolved/main-candidates -name candidate-manifest.json -type f | sort)
          node system-tests/scripts/reconcile-main-candidates.mjs \
            --components system-tests/components.yml \
            --baseline resolved/baseline/baseline.json \
            --baselineDigest "$digest" \
            --currentHeads resolved/current-heads.json \
            "${candidate_args[@]}" \
            "${digest_args[@]}" \
            --output resolved/resolved-set.json
          echo "has_candidates=$(jq -r '.candidates | length > 0' resolved/resolved-set.json)" >> "$GITHUB_OUTPUT"
          node system-tests/scripts/select-full-train.mjs \
            --components system-tests/components.yml \
            --policy system-tests/policy.yml \
            --resolvedSet resolved/resolved-set.json \
            --output resolved/suite-matrix.json
          cp resolved/baseline/baseline.json resolved/baseline.json

      - name: Export suite matrix
        id: matrix
        run: echo "matrix=$(jq -c . resolved/suite-matrix.json)" >> "$GITHUB_OUTPUT"

      - name: Record exact tested set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpf-full-train-resolved-set
          path: resolved/
          retention-days: 90
          if-no-files-found: error

  materialize:
    name: Materialize immutable Maven inputs
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Download exact tested set
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: tpf-full-train-resolved-set
          path: resolved

      - name: Install ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Fetch component manifests
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          image="$(jq -r '.candidateManifestImage' system-tests/components.yml)"
          echo "$GHCR_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p component-manifests
          while IFS=$'\t' read -r component digest; do
            mkdir -p "component-manifests/$component"
            oras pull "$image@$digest" --output "component-manifests/$component"
            test -f "component-manifests/$component/candidate-manifest.json"
          done < <(jq -r '.components | to_entries[] | [.key, .value.manifestDigest] | @tsv' resolved/resolved-set.json)
          manifest_args=()
          while IFS= read -r manifest; do manifest_args+=(--manifests "$manifest"); done < <(find component-manifests -name candidate-manifest.json -type f | sort)
          node system-tests/scripts/materialization-plan.mjs \
            --components system-tests/components.yml \
            "${manifest_args[@]}" \
            --output materialization-plan.json

      - name: Configure package repositories
        env:
          PACKAGE_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/tpf-maven"
          node system-tests/scripts/write-maven-settings.mjs \
            --components system-tests/components.yml \
            --output "$RUNNER_TEMP/tpf-maven/settings.xml" \
            --repositoriesOutput "$RUNNER_TEMP/tpf-maven/repositories.txt"

      - name: Hydrate and attest local Maven repository
        run: |
          local_repo="$RUNNER_TEMP/tpf-system-test-m2"
          while IFS= read -r coordinate; do
            ./mvnw -B -s "$RUNNER_TEMP/tpf-maven/settings.xml" \
              org.apache.maven.plugins:maven-dependency-plugin:3.9.0:get \
              -Dartifact="$coordinate" -Dtransitive=true \
              -DremoteRepositories="$(cat "$RUNNER_TEMP/tpf-maven/repositories.txt")" \
              -Dmaven.repo.local="$local_repo" --no-transfer-progress
          done < <(jq -r '.artifacts[].coordinate' materialization-plan.json)
          node system-tests/scripts/verify-materialized.mjs \
            --plan materialization-plan.json --repository "$local_repo"
          mkdir -p "$RUNNER_TEMP/tpf-test-inputs"
          tar -C "$local_repo" -czf "$RUNNER_TEMP/tpf-test-inputs/tpf-system-test-m2.tar.gz" .
          cp resolved/resolved-set.json resolved/suite-matrix.json "$RUNNER_TEMP/tpf-test-inputs/"

      - name: Publish credential-free test inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpf-full-train-inputs
          path: ${{ runner.temp }}/tpf-test-inputs/
          retention-days: 14
          if-no-files-found: error

  run-product-shard:
    name: ${{ matrix.displayName }}
    needs: [resolve, materialize]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    permissions:
      contents: read
    steps:
      - name: Checkout trusted coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: coordination
          persist-credentials: false

      - name: Checkout every pinned shard owner
        env:
          SHARD_JSON: ${{ toJson(matrix) }}
        run: |
          printf '%s\n' "$SHARD_JSON" > shard.json
          node coordination/system-tests/scripts/prepare-shard-sources.mjs \
            --shard shard.json \
            --output owners

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Download credential-free test inputs
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: tpf-full-train-inputs
          path: inputs

      - name: Extract isolated Maven repository
        run: |
          mkdir -p "$RUNNER_TEMP/tpf-system-test-m2"
          tar -C "$RUNNER_TEMP/tpf-system-test-m2" -xzf inputs/tpf-system-test-m2.tar.gz

      - name: Run product shard without privileged credentials
        run: |
          node coordination/system-tests/scripts/run-shard.mjs \
            --shard "$GITHUB_WORKSPACE/shard.json" \
            --coordination "$GITHUB_WORKSPACE/coordination" \
            --owners "$GITHUB_WORKSPACE/owners" \
            --resolvedSet "$GITHUB_WORKSPACE/inputs/resolved-set.json" \
            --mavenRepository "$RUNNER_TEMP/tpf-system-test-m2"

  promote:
    name: Promote green current-main set
    if: >-
      always() && needs.resolve.result == 'success' &&
      needs.resolve.outputs.has_candidates == 'true' &&
      needs.materialize.result == 'success' &&
      needs.run-product-shard.result == 'success'
    needs: [resolve, materialize, run-product-shard]
    concurrency:
      group: tpf-system-test-baseline-promotion
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout trusted coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download tested set
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: tpf-full-train-resolved-set
          path: resolved

      - name: List participating repositories
        id: repositories
        run: |
          names="$(jq -nr \
            --slurpfile set resolved/resolved-set.json \
            --slurpfile config system-tests/components.yml \
            '$set[0].candidates | map(.component as $component | $config[0].components[$component].repository | split("/")[1]) | join(",")')"
          echo "names=$names" >> "$GITHUB_OUTPUT"

      - name: Create source-repository read token
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SYSTEM_TEST_APP_ID }}
          private-key: ${{ secrets.SYSTEM_TEST_APP_PRIVATE_KEY }}
          owner: The-Pipeline-Framework
          repositories: ${{ steps.repositories.outputs.names }}
          permission-contents: read

      - name: Confirm tested candidates are still current main
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          jq -n '{}' > resolved/current-heads.json
          while IFS=$'\t' read -r component repository; do
            default_branch="$(gh api "repos/$repository" --jq '.default_branch')"
            current_sha="$(gh api "repos/$repository/commits/$default_branch" --jq '.sha')"
            jq --arg component "$component" --arg sha "$current_sha" \
              '. + {($component): $sha}' resolved/current-heads.json > resolved/current-heads.next.json
            mv resolved/current-heads.next.json resolved/current-heads.json
          done < <(jq -r --slurpfile config system-tests/components.yml '.candidates[] | [.component, $config[0].components[.component].repository] | @tsv' resolved/resolved-set.json)
          node system-tests/scripts/validate-resolved-main-heads.mjs \
            --components system-tests/components.yml \
            --resolvedSet resolved/resolved-set.json \
            --currentHeads resolved/current-heads.json

      - name: Install ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Compare and swap baseline
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          image="$(jq -r '.baselineImage' system-tests/components.yml)"
          echo "$GHCR_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          expected="${{ needs.resolve.outputs.baseline_digest }}"
          test "$(oras resolve "$image:main")" = "$expected"
          node system-tests/scripts/promote-baseline.mjs \
            --components system-tests/components.yml \
            --current resolved/baseline.json \
            --resolvedSet resolved/resolved-set.json \
            --generatedAt "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --output resolved/next-baseline.json
          revision="$(jq -r '.revision' resolved/next-baseline.json)"
          mkdir -p resolved/promotion
          cp resolved/next-baseline.json resolved/promotion/baseline.json
          (
            cd resolved/promotion
            oras push --format json \
              "$image:revision-$revision-${{ github.run_id }}-${{ github.run_attempt }}" \
              baseline.json:application/vnd.tpf.system-test-baseline.v1+json
          ) > resolved/promoted-oci.json
          promoted="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' resolved/promoted-oci.json)"
          test "$(oras resolve "$image:main")" = "$expected"
          oras copy "$image@$promoted" "$image:main"
