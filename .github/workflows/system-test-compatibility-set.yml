name: TPF System Tests — Compatibility Set

on:
  workflow_dispatch:
    inputs:
      set_id:
        description: Stable identifier for this coordinated candidate set
        required: true
        type: string
      pull_requests:
        description: Comma- or newline-separated GitHub pull-request URLs (2–10, one per component)
        required: true
        type: string

concurrency:
  group: tpf-system-test-set-${{ inputs.set_id }}
  cancel-in-progress: true

jobs:
  parse:
    name: Validate compatibility-set request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      repository_names: ${{ steps.request.outputs.repository_names }}
    steps:
      - name: Checkout trusted coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse allowed pull requests
        id: request
        env:
          PULL_REQUESTS: ${{ inputs.pull_requests }}
          SET_ID: ${{ inputs.set_id }}
        run: |
          printf '%s\n' "$PULL_REQUESTS" > pull-requests.txt
          node system-tests/scripts/parse-compatibility-prs.mjs \
            --components system-tests/components.yml \
            --input pull-requests.txt \
            --setId "$SET_ID" \
            --output compatibility-set-request.json
          echo "repository_names=$(jq -r '[.requests[].repositoryName] | join(",")' compatibility-set-request.json)" >> "$GITHUB_OUTPUT"

      - name: Preserve validated request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpf-compatibility-set-request
          path: compatibility-set-request.json
          retention-days: 30
          if-no-files-found: error

  pending:
    name: Resolve exact heads and post pending statuses
    needs: parse
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download validated request
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: tpf-compatibility-set-request
          path: request

      - name: Create repository-scoped status token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SYSTEM_TEST_APP_ID }}
          private-key: ${{ secrets.SYSTEM_TEST_APP_PRIVATE_KEY }}
          owner: The-Pipeline-Framework
          repositories: ${{ needs.parse.outputs.repository_names }}
          permission-contents: read
          permission-pull-requests: read
          permission-statuses: write

      - name: Resolve current or merged pull-request heads
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p targets/pulls
          : > targets/targets.ndjson
          while IFS=$'\t' read -r component repository number; do
            pull="targets/pulls/$component.json"
            gh api "repos/$repository/pulls/$number" > "$pull"
            jq -e --arg repository "$repository" \
              '.base.repo.full_name == $repository and (.base.ref | type == "string") and (.head.sha | test("^[0-9a-f]{40}$")) and (.merged_at != null or .state == "open")' \
              "$pull" > /dev/null

            source_sha=$(jq -r '.head.sha' "$pull")
            base_ref=$(jq -r '.base.ref' "$pull")
            merged=$(jq -r '.merged_at != null' "$pull")
            if [[ "$merged" == true ]]; then
              tested_sha=$(jq -er '.merge_commit_sha | select(test("^[0-9a-f]{40}$"))' "$pull")
              gh api "repos/$repository/commits/$tested_sha" > "targets/pulls/$component-merge.json"
              base_sha=$(jq -er '.parents[0].sha | select(test("^[0-9a-f]{40}$"))' "targets/pulls/$component-merge.json")
            else
              gh api "repos/$repository/commits/$base_ref" > "targets/pulls/$component-base.json"
              base_sha=$(jq -er '.sha | select(test("^[0-9a-f]{40}$"))' "targets/pulls/$component-base.json")
              tested_sha=''
            fi
            jq -c --arg component "$component" --arg repository "$repository" --argjson number "$number" \
              --arg baseRef "$base_ref" --arg sourceSha "$source_sha" --arg baseSha "$base_sha" \
              --argjson merged "$merged" --arg testedSha "$tested_sha" \
              '{component: $component, repository: $repository, repositoryName: ($repository | split("/")[1]), baseRef: $baseRef, pullRequestNumber: $number, sourceSha: $sourceSha, baseSha: $baseSha, merged: $merged} + (if $merged then {testedSha: $testedSha} else {} end)' \
              "targets/pulls/$component.json" >> targets/targets.ndjson
          done < <(jq -r '.requests[] | [.component, .repository, .pullRequestNumber] | @tsv' request/compatibility-set-request.json)
          jq -s '{schemaVersion: 1, targets: sort_by(.component)}' targets/targets.ndjson > targets/targets.json

      - name: Mark every participating SHA pending
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          while IFS=$'\t' read -r repository sha; do
            gh api --method POST "repos/$repository/statuses/$sha" \
              -f state=pending \
              -f context='tpf/system-tests' \
              -f description='TPF coordinated candidate build and product tests are running' \
              -f target_url="$TARGET_URL"
          done < <(jq -r '.targets[] | [.repository, .sourceSha] | @tsv' targets/targets.json)

      - name: Preserve immutable targets
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpf-compatibility-set-targets
          path: targets/
          retention-days: 30
          if-no-files-found: error

  baseline:
    name: Materialize last-known-green baseline
    needs: pending
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout trusted coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Install ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Resolve immutable baseline metadata
        id: baseline
        env:
          GHCR_TOKEN: ${{ github.token }}
          PACKAGE_TOKEN: ${{ github.token }}
        run: |
          baseline_image="$(jq -r '.baselineImage' system-tests/components.yml)"
          manifest_image="$(jq -r '.candidateManifestImage' system-tests/components.yml)"
          echo "$GHCR_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          digest="$(oras resolve "$baseline_image:main")"
          case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "cache_key=${digest#sha256:}" >> "$GITHUB_OUTPUT"
          mkdir -p baseline/raw baseline/manifests "$RUNNER_TEMP/tpf-maven"
          oras pull "$baseline_image@$digest" --output baseline/raw
          while IFS=$'\t' read -r component manifest_digest; do
            mkdir -p "baseline/manifests/$component"
            oras pull "$manifest_image@$manifest_digest" --output "baseline/manifests/$component"
          done < <(jq -r '.components | to_entries[] | [.key, .value.manifestDigest] | @tsv' baseline/raw/baseline.json)
          manifest_args=()
          while IFS= read -r manifest; do manifest_args+=(--manifests "$manifest"); done < <(find baseline/manifests -name candidate-manifest.json -type f | sort)
          node system-tests/scripts/materialization-plan.mjs \
            --components system-tests/components.yml \
            "${manifest_args[@]}" \
            --output baseline/materialization-plan.json
          node system-tests/scripts/write-maven-settings.mjs \
            --components system-tests/components.yml \
            --output "$RUNNER_TEMP/tpf-maven/settings.xml" \
            --repositoriesOutput "$RUNNER_TEMP/tpf-maven/repositories.txt"

      - name: Restore immutable baseline Maven repository
        id: baseline-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tpf-system-test-m2
          key: tpf-system-test-baseline-${{ steps.baseline.outputs.cache_key }}
          restore-keys: |
            tpf-system-test-baseline-

      - name: Hydrate baseline Maven repository on cache miss
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        env:
          PACKAGE_TOKEN: ${{ github.token }}
        run: |
          local_repo="$RUNNER_TEMP/tpf-system-test-m2"
          while IFS= read -r coordinate; do
            ./mvnw -B -s "$RUNNER_TEMP/tpf-maven/settings.xml" \
              org.apache.maven.plugins:maven-dependency-plugin:3.9.0:get \
              -Dartifact="$coordinate" \
              -DremoteRepositories="$(cat "$RUNNER_TEMP/tpf-maven/repositories.txt")" \
              -Dtransitive=true \
              -Dmaven.repo.local="$local_repo" \
              --no-transfer-progress
          done < <(jq -r '.artifacts[].coordinate' baseline/materialization-plan.json)

      - name: Verify and package credential-free baseline
        run: |
          local_repo="$RUNNER_TEMP/tpf-system-test-m2"
          node system-tests/scripts/sanitize-maven-repository.mjs \
            --repository "$local_repo"
          node system-tests/scripts/verify-materialized.mjs \
            --plan baseline/materialization-plan.json \
            --repository "$local_repo"
          node system-tests/scripts/baseline-set.mjs \
            --components system-tests/components.yml \
            --baseline baseline/raw/baseline.json \
            --baselineDigest "${{ steps.baseline.outputs.digest }}" \
            --output baseline/resolved-set.json
          tar -C "$local_repo" -czf baseline/tpf-system-test-m2.tar.gz .

      - name: Preserve credential-free baseline inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpf-compatibility-set-baseline
          path: baseline/
          retention-days: 14
          if-no-files-found: error

  bootstrap:
    name: Build the dependency-ordered candidate set
    needs: [parse, pending, baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout trusted coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download exact targets
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: tpf-compatibility-set-targets
          path: intake/targets

      - name: Download compatibility-set request
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: tpf-compatibility-set-request
          path: intake/request

      - name: Download credential-free baseline
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: tpf-compatibility-set-baseline
          path: baseline

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Record JDK 21
        run: echo "TPF_JAVA_21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Setup JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - name: Record JDK 25
        run: echo "TPF_JAVA_25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Build every Maven candidate against its exact predecessors
        env:
          SET_ID: ${{ inputs.set_id }}
        run: |
          local_repo="$RUNNER_TEMP/tpf-system-test-m2"
          mkdir -p "$local_repo" resolved manifests "$RUNNER_TEMP/tpf-candidate-metadata"
          tar -C "$local_repo" -xzf baseline/tpf-system-test-m2.tar.gz
          node system-tests/scripts/bootstrap-compatibility-set.mjs \
            --components system-tests/components.yml \
            --baselineResolvedSet baseline/resolved-set.json \
            --targets intake/targets/targets.json \
            --sources "$RUNNER_TEMP/tpf-set-sources" \
            --mavenRepository "$local_repo" \
            --manifests manifests \
            --output resolved/pre-bom-resolved-set.json \
            --setId "$SET_ID" \
            --coordinationRepository "${{ github.repository }}" \
            --coordinationSha "${{ github.sha }}" \
            --runId "${{ github.run_id }}" \
            --runAttempt "${{ github.run_attempt }}" \
            --java21Home "$TPF_JAVA_21_HOME" \
            --java25Home "$TPF_JAVA_25_HOME" \
            --runnerTemp "$RUNNER_TEMP/tpf-candidate-metadata"
          node system-tests/scripts/materialize-tested-bom.mjs \
            --source framework/bom/pom.xml \
            --resolvedSet resolved/pre-bom-resolved-set.json \
            --repository "$local_repo" \
            --coordinationSha "${{ github.sha }}" \
            --outputResolvedSet resolved/resolved-set.json
          node system-tests/scripts/select-set-suites.mjs \
            --components system-tests/components.yml \
            --policy system-tests/policy.yml \
            --resolvedSet resolved/resolved-set.json \
            --compatibilitySet intake/request/compatibility-set-request.json \
            --output resolved/suite-matrix.json
          node system-tests/scripts/sanitize-maven-repository.mjs \
            --repository "$local_repo"
          mkdir -p "$RUNNER_TEMP/tpf-test-inputs"
          tar -C "$local_repo" -czf "$RUNNER_TEMP/tpf-test-inputs/tpf-system-test-m2.tar.gz" .
          cp resolved/resolved-set.json resolved/suite-matrix.json "$RUNNER_TEMP/tpf-test-inputs/"
          cp -R manifests "$RUNNER_TEMP/tpf-test-inputs/"

      - name: Export product-shard matrix
        id: matrix
        run: echo "matrix=$(jq -c . resolved/suite-matrix.json)" >> "$GITHUB_OUTPUT"

      - name: Preserve the exact bootstrapped candidate set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpf-materialized-compatibility-set-inputs
          path: ${{ runner.temp }}/tpf-test-inputs/
          retention-days: 14
          if-no-files-found: error

  run-product-shard:
    name: ${{ matrix.displayName }}
    needs: bootstrap
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.bootstrap.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    permissions:
      contents: read
    steps:
      - name: Checkout trusted coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: coordination
          persist-credentials: false

      - name: Checkout every pinned shard owner
        env:
          SHARD_JSON: ${{ toJson(matrix) }}
        run: |
          printf '%s\n' "$SHARD_JSON" > shard.json
          node coordination/system-tests/scripts/prepare-shard-sources.mjs \
            --shard shard.json \
            --output owners

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Download credential-free inputs
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: tpf-materialized-compatibility-set-inputs
          path: inputs

      - name: Run product shard without privileged credentials
        run: |
          mkdir -p "$RUNNER_TEMP/tpf-system-test-m2"
          tar -C "$RUNNER_TEMP/tpf-system-test-m2" -xzf inputs/tpf-system-test-m2.tar.gz
          node coordination/system-tests/scripts/run-shard.mjs \
            --shard "$GITHUB_WORKSPACE/shard.json" \
            --coordination "$GITHUB_WORKSPACE/coordination" \
            --owners "$GITHUB_WORKSPACE/owners" \
            --resolvedSet "$GITHUB_WORKSPACE/inputs/resolved-set.json" \
            --mavenRepository "$RUNNER_TEMP/tpf-system-test-m2"

  report:
    name: Report one result to every participating SHA
    if: always() && needs.pending.result != 'skipped'
    needs: [parse, pending, baseline, bootstrap, run-product-shard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download immutable targets
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: tpf-compatibility-set-targets
          path: targets

      - name: Create repository-scoped status token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SYSTEM_TEST_APP_ID }}
          private-key: ${{ secrets.SYSTEM_TEST_APP_PRIVATE_KEY }}
          owner: The-Pipeline-Framework
          repositories: ${{ needs.parse.outputs.repository_names }}
          permission-statuses: write

      - name: Publish aggregate result
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASELINE_RESULT: ${{ needs.baseline.result }}
          BOOTSTRAP_RESULT: ${{ needs.bootstrap.result }}
          TEST_RESULT: ${{ needs.run-product-shard.result }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$BOOTSTRAP_RESULT" = failure ] || [ "$TEST_RESULT" = failure ]; then
            state=failure
            description='A coordinated candidate build or mandatory product-test shard failed'
          elif [ "$BASELINE_RESULT" = success ] && [ "$BOOTSTRAP_RESULT" = success ] && [ "$TEST_RESULT" = success ]; then
            state=success
            description='The dependency-ordered candidate set passed all product-test shards'
          else
            state=error
            description='TPF coordinated orchestration or infrastructure failed'
          fi
          while IFS=$'\t' read -r repository sha; do
            gh api --method POST "repos/$repository/statuses/$sha" \
              -f state="$state" \
              -f context='tpf/system-tests' \
              -f description="$description" \
              -f target_url="$TARGET_URL"
          done < <(jq -r '.targets[] | [.repository, .sourceSha] | @tsv' targets/targets.json)
