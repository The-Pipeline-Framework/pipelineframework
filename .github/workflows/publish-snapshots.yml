name: Publish — Nightly Maven Central Snapshots

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: central-snapshot-publishing
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and Publish Snapshot
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (GPG enabled)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Verify framework
        run: ./mvnw -B -pl framework,framework/runtime,framework/deployment -am clean verify --no-transfer-progress -Dtpf.flatten.skip=false -Dmaven.repo.local="$PWD/.m2/repository"

      - name: Deploy snapshot to Maven Central
        run: ./mvnw -B -pl framework,framework/runtime,framework/deployment -am deploy -Pcentral-publishing -DskipTests -U --no-transfer-progress -Dtpf.flatten.skip=false -Dmaven.repo.local="$PWD/.m2/repository"
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
