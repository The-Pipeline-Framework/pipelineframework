name: CI — Build (PR / Non-Main)

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'framework/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - 'scripts/ci/**'
      - '.github/actions/setup-testcontainers/**'
      - '.github/workflows/build.yml'

env:
  MAVEN_OPTS: -Xmx1g -Xms512m
  MAVEN_ARGS_BOOTSTRAP: -B -U -T 1C -V -Dmaven.test.redirectTestOutputToFile=true -Dsurefire.parallel=none -Dfailsafe.parallel=none
  MAVEN_ARGS_PR: -B -T 1 -V -Dmaven.test.redirectTestOutputToFile=true -Dsurefire.parallel=none -Dfailsafe.parallel=none
  BOOTSTRAP_ARTIFACT: pr-m2-cache
  UNIT_TEST_PATTERN: "*,!*IT,!*ITCase"
  GENERIC_VERIFY_IT_PATTERN: "*IT,*ITCase"

jobs:
  bootstrap:
    name: Bootstrap Framework Artifacts
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact-meta.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Configure Maven
        run: echo "MAVEN_ARGS=${{ env.MAVEN_ARGS_BOOTSTRAP }} --no-transfer-progress" >> $GITHUB_ENV

      - name: Install coordination artifacts to local repository
        run: ./scripts/ci/bootstrap-local-repo-prereqs.sh framework

      - name: Package framework artifacts
        run: |
          mkdir -p /tmp/m2-artifacts
          cd ~/.m2/repository
          dirs=(org/pipelineframework)
          if [ ! -d "org/pipelineframework" ]; then
            echo "::error::Missing required framework artifact subtree 'org/pipelineframework' before packaging ${{ env.BOOTSTRAP_ARTIFACT }}."
            exit 1
          fi
          tar -czf /tmp/m2-artifacts/${{ env.BOOTSTRAP_ARTIFACT }}.tar.gz "${dirs[@]}"

      - name: Record artifact metadata
        id: artifact-meta
        run: echo "artifact_name=${{ env.BOOTSTRAP_ARTIFACT }}" >> "$GITHUB_OUTPUT"

      - name: Upload framework artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BOOTSTRAP_ARTIFACT }}
          path: /tmp/m2-artifacts/${{ env.BOOTSTRAP_ARTIFACT }}.tar.gz
          retention-days: 7
          if-no-files-found: error

  unit-tests:
    name: Build & Unit Tests
    needs: bootstrap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Configure Maven
        run: echo "MAVEN_ARGS=${{ env.MAVEN_ARGS_PR }} --no-transfer-progress" >> $GITHUB_ENV

      - name: Download framework artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ needs.bootstrap.outputs.artifact_name }}
          path: /tmp/m2-artifacts

      - name: Extract framework artifacts
        run: |
          mkdir -p ~/.m2/repository
          tar -xzf /tmp/m2-artifacts/${{ needs.bootstrap.outputs.artifact_name }}.tar.gz -C ~/.m2/repository

      - name: Run unit tests
        run: |
          read -r -a maven_args <<< "$MAVEN_ARGS"
          # Search transport/topology-specific tests stay in their dedicated smoke or E2E lanes, not in the generic unit lane.
          ./mvnw "${maven_args[@]}" clean test \
            "-Dtest=${{ env.UNIT_TEST_PATTERN }}" \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DskipITs=true

  generic-verify:
    name: Generic Verify
    needs: bootstrap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Configure Maven
        run: echo "MAVEN_ARGS=${{ env.MAVEN_ARGS_PR }} --no-transfer-progress" >> $GITHUB_ENV

      - name: Download framework artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ needs.bootstrap.outputs.artifact_name }}
          path: /tmp/m2-artifacts

      - name: Extract framework artifacts
        run: |
          mkdir -p ~/.m2/repository
          tar -xzf /tmp/m2-artifacts/${{ needs.bootstrap.outputs.artifact_name }}.tar.gz -C ~/.m2/repository

      - name: Run generic verify
        run: |
          read -r -a maven_args <<< "$MAVEN_ARGS"
          # Dedicated E2E or topology-specific tests stay in their reusable jobs, not in generic verify.
          ./mvnw "${maven_args[@]}" clean verify \
            -DskipUnitTests=true \
            -Dfailsafe.failIfNoSpecifiedTests=false \
            "-Dit.test=${{ env.GENERIC_VERIFY_IT_PATTERN }}"

  canonical-fresh-checkout:
    name: Canonical Fresh Checkout Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Reject source-selection migration machinery
        run: ./scripts/verify-canonical-maven-build.sh

      - name: Build from a fresh Maven repository
        run: |
          build_log="$RUNNER_TEMP/canonical-fresh-checkout.log"
          if ! ./mvnw -B -ntp clean install -DskipITs=true -Dmaven.repo.local="$RUNNER_TEMP/tpf-canonical-m2" > "$build_log" 2>&1; then
            grep -E '\[ERROR\]|BUILD FAILURE|Failed to execute|Tests run:' "$build_log" | tail -200 || true
            exit 1
          fi
          tail -40 "$build_log"

      - name: Upload canonical build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-fresh-checkout-log
          path: ${{ runner.temp }}/canonical-fresh-checkout.log
          retention-days: 7
